  // --- Author mini-portfolio side panel ---
  // Opened from a story's "by AuthorName" link. This is a quick peek: it
  // does NOT touch the current search, filters, or view mode, so browsing
  // picks up right where it was left when the panel closes. It stays tied
  // to whichever story row triggered it and auto-closes the moment that
  // story is collapsed again (see the row-collapse handling below).
  var authorPanelEl = document.getElementById('author-panel');
  var authorPanelBackdrop = document.getElementById('author-panel-backdrop');
  var authorPanelNameEl = document.getElementById('author-panel-name');
  var authorPanelMetaEl = document.getElementById('author-panel-meta');
  var authorPanelListEl = document.getElementById('author-panel-list');
  var authorPanelCloseBtn = document.getElementById('author-panel-close');
  var authorPanelTriggerHref = null;
  var authorPanelName = null;
  // The sidebar panel gets its own expanded-story tracking, separate from
  // authorStoryExpandedSet (used by the full Authors view), so opening the
  // panel always starts collapsed rather than remembering the last session.
  var authorPanelExpandedSet = new Set();

  // Simple 3-state sort for the panel's own story list: click a field once
  // for descending, twice for ascending, a third time to clear back to the
  // default (most-recent-date-added) order. Independent of the main list's
  // sort/filter state.
  var authorPanelSort = {field: 'added', dir: 'desc'};
  var authorPanelSortEl = document.getElementById('author-panel-sort');

  function authorPanelSortValue(s, field){
    if (field === 'title') return stripArticle(s.title);
    if (field === 'added') return (s._addedDays === null || s._addedDays === undefined) ? -Infinity : s._addedDays;
    if (field === 'updated') return (s._updatedDays === null || s._updatedDays === undefined) ? -Infinity : s._updatedDays;
    if (field === 'words') return ('words' in s) ? s.words : -Infinity;
  }

  function updateAuthorPanelSortButtons(){
    authorPanelSortEl.querySelectorAll('.author-sort-btn').forEach(function(btn){
      var field = btn.dataset.field;
      var label = btn.textContent.replace(/^[\u2191\u2193]\s*/, '').trim();
      if (field === authorPanelSort.field){
        btn.classList.add('active');
        var arrow = authorPanelSort.dir === 'asc' ? '\u2191' : '\u2193';
        btn.innerHTML = '<span class="arrow">' + arrow + '</span>' + escapeHtml(label);
      } else {
        btn.classList.remove('active');
        btn.textContent = label;
      }
    });
  }

  authorPanelSortEl.addEventListener('click', function(e){
    var btn = e.target.closest('.author-sort-btn');
    if (!btn) return;
    var field = btn.dataset.field;
    if (authorPanelSort.field !== field){
      authorPanelSort = {field: field, dir: 'desc'};
    } else if (authorPanelSort.dir === 'desc'){
      authorPanelSort.dir = 'asc';
    } else {
      authorPanelSort = {field: null, dir: null};
    }
    updateAuthorPanelSortButtons();
    renderAuthorPanelList();
  });

  function renderAuthorPanelList(){
    if (!authorPanelName) return;
    var authored = stories.filter(function(s){ return s.author === authorPanelName; }).slice().sort(function(a,b){
      var va = authorPanelSortValue(a, 'added'), vb = authorPanelSortValue(b, 'added');
      return va < vb ? 1 : (va > vb ? -1 : 0);
    });
    if (authorPanelSort.field){
      var field = authorPanelSort.field, dir = authorPanelSort.dir;
      authored.sort(function(a,b){
        var va = authorPanelSortValue(a, field), vb = authorPanelSortValue(b, field);
        var cmp = va < vb ? -1 : (va > vb ? 1 : 0);
        return dir === 'asc' ? cmp : -cmp;
      });
    }
    authorPanelListEl.innerHTML = authored.map(function(s){
      return storyItemHtml(s, authorPanelExpandedSet.has(s.href));
    }).join('');
  }

  function openAuthorPanel(name, triggerHref){
    authorPanelName = name;
    authorPanelTriggerHref = triggerHref || null;
    authorPanelExpandedSet = new Set();
    authorPanelSort = {field: 'added', dir: 'desc'};
    updateAuthorPanelSortButtons();

    var authored = stories.filter(function(s){ return s.author === name; });
    var totalWords = authored.reduce(function(sum,s){ return sum + ('words' in s ? s.words : 0); }, 0);

    authorPanelNameEl.textContent = name;
    // Author pages on the site are named after the author with spaces as dashes.
    document.getElementById('author-panel-link').href =
      'https://mcstories.com/Authors/' + encodeURIComponent(name.trim().replace(/\s+/g, '-')) + '.html';
    authorPanelMetaEl.textContent = authored.length.toLocaleString() + (authored.length === 1 ? ' story' : ' stories') +
      ' \u00b7 ' + totalWords.toLocaleString() + ' words total';
    renderAuthorPanelList();
    updateAuthorPanelBookmark();

    authorPanelEl.classList.add('open');
    authorPanelEl.setAttribute('aria-hidden', 'false');
    authorPanelBackdrop.classList.add('show');
    document.body.classList.add('author-panel-open');
    authorPanelEl.scrollTop = 0;
  }

  function closeAuthorPanel(){
    if (!authorPanelName) return;
    authorPanelName = null;
    authorPanelTriggerHref = null;
    authorPanelExpandedSet = new Set();
    authorPanelEl.classList.remove('open');
    authorPanelEl.setAttribute('aria-hidden', 'true');
    authorPanelBackdrop.classList.remove('show');
    document.body.classList.remove('author-panel-open');
  }

  var authorPanelBookmarkBtn = document.getElementById('author-panel-bookmark');
  function updateAuthorPanelBookmark(){
    if (!authorPanelName) return;
    var on = authorBookmarks.has(authorPanelName);
    var label = on ? 'Remove author bookmark' : 'Bookmark this author';
    authorPanelBookmarkBtn.classList.toggle('active', on);
    authorPanelBookmarkBtn.setAttribute('aria-pressed', on);
    authorPanelBookmarkBtn.setAttribute('aria-label', label);
    authorPanelBookmarkBtn.title = label;
    authorPanelBookmarkBtn.innerHTML = on ? BOOKMARK_ICON_FILLED : BOOKMARK_ICON_OUTLINE;
  }
  authorPanelBookmarkBtn.addEventListener('click', function(){
    toggleAuthorBookmark(authorPanelName);
    // If the Authors list is what's showing behind the panel, keep its tabs
    // (and any Saved filter) in step.
    if (viewMode === 'authors'){
      if (savedStateByMode.authors === 'none') renderAuthorList(currentAuthorList);
      else render();
    }
  });
  authorPanelCloseBtn.addEventListener('click', closeAuthorPanel);
  authorPanelBackdrop.addEventListener('click', closeAuthorPanel);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeAuthorPanel();
  });

  // Expand a story inside the panel to show its synopsis/tags/chapters.
  // The panel uses its own authorPanelExpandedSet (reset each time the
  // panel opens) rather than authorStoryExpandedSet, which belongs to the
  // full Authors view - see goToAuthor() for how the two are reconciled
  // when jumping from the panel to the full portfolio.
  authorPanelListEl.addEventListener('click', function(e){
    var bookmarkBtn = e.target.closest('.bookmark-btn');
    if (bookmarkBtn){
      toggleBookmark(bookmarkBtn.dataset.href);
      renderAuthorPanelList();
      return;
    }
    var tagBtn = e.target.closest('.tag-chip');
    if (tagBtn){
      // The panel's own story pool ignores tag filters entirely (it always
      // shows everything by this author), so there's nothing to exempt here
      // - just update the shared tag state and refresh both the panel and
      // the main page so everything stays in sync, without collapsing.
      cycleTagState(tagBtn.dataset.code);
      updateGroupBadges();
      render();
      renderAuthorPanelList();
      return;
    }
    if (e.target.closest('a.chapter-link') || e.target.closest('.author-stories') || e.target.closest('.read-story-btn')) return;
    var item = e.target.closest('.author-story-item');
    if (!item) return;
    var href = item.dataset.href;
    if (authorPanelExpandedSet.has(href)) authorPanelExpandedSet.delete(href);
    else authorPanelExpandedSet.add(href);
    renderAuthorPanelList();
  });

  authorPanelListEl.addEventListener('keydown', function(e){
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var item = e.target.closest('.author-story-item:not(.chapter-link)');
    if (!item || e.target !== item) return;
    e.preventDefault();
    var href = item.dataset.href;
    if (authorPanelExpandedSet.has(href)) authorPanelExpandedSet.delete(href);
    else authorPanelExpandedSet.add(href);
    renderAuthorPanelList();
  });

  var matchMode = 'and';
  modeAnd.addEventListener('click', function(){ matchMode='and'; modeAnd.classList.add('active'); modeOr.classList.remove('active'); render(); });
  modeOr.addEventListener('click', function(){ matchMode='or'; modeOr.classList.add('active'); modeAnd.classList.remove('active'); render(); });

  var sortField = 'added';
  var sortDir = 'desc';

  var sortDirLabels = { desc: '↓ High → Low', asc: '↑ Low → High' };

  function updateSortUI(){
    document.querySelectorAll('.dir-toggle').forEach(function(toggle){
      var field = toggle.dataset.field;
      toggle.querySelectorAll('button').forEach(function(btn){
        btn.classList.toggle('active', field === sortField && btn.dataset.dir === sortDir);
      });
    });
    document.querySelectorAll('.sort-badge').forEach(function(badge){
      var isActive = badge.dataset.field === sortField;
      badge.classList.toggle('show', isActive);
      if (isActive) badge.textContent = sortDirLabels[sortDir];
    });
  }

  document.querySelectorAll('.dir-toggle').forEach(function(toggle){
    var field = toggle.dataset.field;
    toggle.querySelectorAll('button').forEach(function(btn){
      btn.addEventListener('click', function(){
        sortField = field;
        sortDir = btn.dataset.dir;
        updateSortUI();
        render();
      });
    });
  });

  updateSortUI();

  function activeTags(){
    return tagCodes.filter(function(c){ return chips[c].dataset.state === 'include'; });
  }

  function excludedTags(){
    return tagCodes.filter(function(c){ return chips[c].dataset.state === 'exclude'; });
  }

  function stripArticle(t){
    var low = t.toLowerCase();
    if (low.indexOf('the ') === 0) return low.slice(4);
    if (low.indexOf('an ') === 0) return low.slice(3);
    if (low.indexOf('a ') === 0) return low.slice(2);
    return low;
  }

  function toDays(iso){
    if (!iso) return null;
    var t = Date.parse(iso + 'T00:00:00Z');
    if (isNaN(t)) return null;
    return Math.floor(t / 86400000);
  }

  function fmtDate(iso){
    if (!iso) return null;
    var parts = iso.split('-');
    if (parts.length !== 3) return iso;
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var y = parts[0], m = parseInt(parts[1],10)-1, d = parseInt(parts[2],10);
    return d + ' ' + months[m] + ' ' + y;
  }

  function fmtDays(days){
    var d = new Date(days * 86400000);
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d.getUTCDate() + ' ' + months[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
  }

  stories.forEach(function(s){
    s._addedDays = toDays(s.date_added);
    s._updatedDays = toDays(s.date_updated);
  });

  function buildSlider(containerId, minVal, maxVal, formatFn, labelMinEl, labelMaxEl, onChange){
    var container = document.getElementById(containerId);
    var thumbMin = container.querySelector('.thumb-min');
    var thumbMax = container.querySelector('.thumb-max');
    var fill = container.querySelector('.track-fill');

    thumbMin.min = minVal; thumbMin.max = maxVal; thumbMin.value = minVal; thumbMin.step = 1;
    thumbMax.min = minVal; thumbMax.max = maxVal; thumbMax.value = maxVal; thumbMax.step = 1;

    function update(){
      var lo = parseInt(thumbMin.value, 10);
      var hi = parseInt(thumbMax.value, 10);
      if (lo > hi){
        var tmp = lo; lo = hi; hi = tmp;
      }
      var range = maxVal - minVal || 1;
      var pctLo = (lo - minVal) / range * 100;
      var pctHi = (hi - minVal) / range * 100;
      fill.style.left = pctLo + '%';
      fill.style.width = (pctHi - pctLo) + '%';
      labelMinEl.textContent = formatFn(lo);
      labelMaxEl.textContent = formatFn(hi);
      return {lo: lo, hi: hi};
    }

    var state = update();

    function handleInput(){
      state = update();
      onChange(state.lo, state.hi, state.lo === minVal && state.hi === maxVal);
    }

    thumbMin.addEventListener('input', handleInput);
    thumbMax.addEventListener('input', handleInput);

    return {
      reset: function(){ thumbMin.value = minVal; thumbMax.value = maxVal; state = update(); },
      isFull: function(){ return state.lo === minVal && state.hi === maxVal; },
      getState: function(){ return state; }
    };
  }

  var wordVals = stories.filter(function(s){ return 'words' in s; }).map(function(s){ return s.words; });
  var wMin = wordVals.length ? Math.min.apply(null, wordVals) : 0;
  var wMax = wordVals.length ? Math.max.apply(null, wordVals) : 0;

  var addedVals = stories.filter(function(s){ return s._addedDays !== null; }).map(function(s){ return s._addedDays; });
  var aMin = addedVals.length ? Math.min.apply(null, addedVals) : 0;
  var aMax = addedVals.length ? Math.max.apply(null, addedVals) : 0;

  var updatedVals = stories.filter(function(s){ return s._updatedDays !== null; }).map(function(s){ return s._updatedDays; });
  var uMin = updatedVals.length ? Math.min.apply(null, updatedVals) : 0;
  var uMax = updatedVals.length ? Math.max.apply(null, updatedVals) : 0;

  var wordFilter = {lo: wMin, hi: wMax, active: false};
  var addedFilter = {lo: aMin, hi: aMax, active: false};
  var updatedFilter = {lo: uMin, hi: uMax, active: false};

  var wordsSlider = buildSlider('slider-words', wMin, wMax,
    function(v){ return v.toLocaleString() + ' words'; },
    document.getElementById('words-min-label'), document.getElementById('words-max-label'),
    function(lo, hi, isFull){ wordFilter = {lo: lo, hi: hi, active: !isFull}; debounceRender(); });

  var addedSlider = buildSlider('slider-added', aMin, aMax,
    fmtDays,
    document.getElementById('added-min-label'), document.getElementById('added-max-label'),
    function(lo, hi, isFull){ addedFilter = {lo: lo, hi: hi, active: !isFull}; debounceRender(); });

  var updatedSlider = buildSlider('slider-updated', uMin, uMax,
    fmtDays,
    document.getElementById('updated-min-label'), document.getElementById('updated-max-label'),
    function(lo, hi, isFull){ updatedFilter = {lo: lo, hi: hi, active: !isFull}; debounceRender(); });

  var sliderDebounce;
  function debounceRender(){
    clearTimeout(sliderDebounce);
    sliderDebounce = setTimeout(render, 60);
  }

  var pageSize = 150;
  var shown = pageSize;
  var io = new IntersectionObserver(function(entries){
    if (entries[0].isIntersecting){
      shown += pageSize;
      if (viewMode === 'authors'){
        renderAuthorList(currentAuthorList);
      } else {
        renderList(currentFiltered);
      }
    }
  });
  io.observe(sentinel);

  var currentFiltered = stories;
  var currentAuthorList = [];

  function applyFilters(){
    var q = searchInput.value.trim().toLowerCase();
    var active = activeTags();
    var excluded = excludedTags();

    return stories.filter(function(s){
      if (viewMode === 'authors'){
        // Authors view: "Saved" refers to saved authors, not saved stories.
        var as = savedStateByMode.authors;
        if (as === 'include' && !authorBookmarks.has(s.author)) return false;
        if (as === 'exclude' && authorBookmarks.has(s.author)) return false;
      } else {
        var ss = savedStateByMode.stories;
        if (ss === 'include' && !bookmarks.has(s.href)) return false;
        if (ss === 'exclude' && bookmarks.has(s.href)) return false;
      }

      if (q){
        if (viewMode === 'authors'){
          var inAuthor = s.author && s.author.toLowerCase().indexOf(q) !== -1;
          if (!inAuthor) return false;
        } else {
          var haystack = searchScope === 'synopsis' ? (s.synopsis || '') : s.title;
          if (haystack.toLowerCase().indexOf(q) === -1) return false;
        }
      }

      if (active.length > 0){
        var tagMatch = matchMode === 'and'
          ? active.every(function(t){ return s.tags.indexOf(t) !== -1; })
          : active.some(function(t){ return s.tags.indexOf(t) !== -1; });
        if (!tagMatch) return false;
      }

      if (excluded.length > 0 && !exemptFromExclusion.has(s.href)){
        var hasExcluded = excluded.some(function(t){ return s.tags.indexOf(t) !== -1; });
        if (hasExcluded) return false;
      }

      if (wordFilter.active){
        if (!('words' in s) || s.words < wordFilter.lo || s.words > wordFilter.hi) return false;
      }
      if (addedFilter.active){
        if (s._addedDays === null || s._addedDays < addedFilter.lo || s._addedDays > addedFilter.hi) return false;
      }
      if (updatedFilter.active){
        if (s._updatedDays === null || s._updatedDays < updatedFilter.lo || s._updatedDays > updatedFilter.hi) return false;
      }

      return true;
    });
  }

  function sortStoriesList(list){
    var field = sortField;
    return list.slice().sort(function(a,b){
      var cmp;
      if (field === 'title'){
        var ka = stripArticle(a.title), kb = stripArticle(b.title);
        cmp = ka < kb ? -1 : (ka > kb ? 1 : 0);
      } else if (field === 'added'){
        var da = (a._addedDays === null) ? -Infinity : a._addedDays;
        var db = (b._addedDays === null) ? -Infinity : b._addedDays;
        cmp = da - db;
      } else if (field === 'updated'){
        var ua = (a._updatedDays === null) ? -Infinity : a._updatedDays;
        var ub = (b._updatedDays === null) ? -Infinity : b._updatedDays;
        cmp = ua - ub;
      } else if (field === 'words'){
        var wa = ('words' in a) ? a.words : -Infinity;
        var wb = ('words' in b) ? b.words : -Infinity;
        cmp = wa - wb;
      }
      return sortDir === 'desc' ? -cmp : cmp;
    });
  }

  function filterStories(){
    return sortStoriesList(applyFilters());
  }

  function buildAuthorList(storyPool){
    var map = {};
    storyPool.forEach(function(s){
      if (!s.author) return;
      if (!map[s.author]) map[s.author] = [];
      map[s.author].push(s);
    });
    return Object.keys(map).map(function(name){
      var arr = map[name].slice().sort(function(a,b){
        var da = (a._addedDays === null) ? -Infinity : a._addedDays;
        var db = (b._addedDays === null) ? -Infinity : b._addedDays;
        return db - da;
      });
      var totalWords = arr.reduce(function(sum,s){ return sum + ('words' in s ? s.words : 0); }, 0);
      var latestAdded = arr.reduce(function(m,s){ return (s._addedDays !== null && (m === null || s._addedDays > m)) ? s._addedDays : m; }, null);
      var latestUpdated = arr.reduce(function(m,s){ return (s._updatedDays !== null && (m === null || s._updatedDays > m)) ? s._updatedDays : m; }, null);
      return { name: name, stories: arr, totalWords: totalWords, latestAdded: latestAdded, latestUpdated: latestUpdated, count: arr.length };
    });
  }

  function sortAuthorList(list){
    var field = sortField;
    return list.slice().sort(function(a,b){
      var cmp;
      if (field === 'title'){
        var ka = a.name.toLowerCase(), kb = b.name.toLowerCase();
        cmp = ka < kb ? -1 : (ka > kb ? 1 : 0);
      } else if (field === 'added'){
        var da = (a.latestAdded === null) ? -Infinity : a.latestAdded;
        var db = (b.latestAdded === null) ? -Infinity : b.latestAdded;
        cmp = da - db;
      } else if (field === 'updated'){
        var ua = (a.latestUpdated === null) ? -Infinity : a.latestUpdated;
        var ub = (b.latestUpdated === null) ? -Infinity : b.latestUpdated;
        cmp = ua - ub;
      } else if (field === 'words'){
        cmp = a.totalWords - b.totalWords;
      }
      return sortDir === 'desc' ? -cmp : cmp;
    });
  }

  function truncate(str, n){
    if (str.length <= n) return str;
    var cut = str.slice(0, n);
    var lastSpace = cut.lastIndexOf(' ');
    return cut.slice(0, lastSpace > 0 ? lastSpace : n) + '\u2026';
  }

  var expandedSet = new Set();
  var authorExpandedSet = new Set();
  var authorStoryExpandedSet = new Set();
  // Per-author sort state for the sort buttons inside each expanded author
  // section on the main Authors view - independent of the side panel's own
  // authorPanelSort, and independent per author so expanding several authors
  // at once keeps their own sort choices.
  var authorRowSort = {};

  function authorRowSortButtonsHtml(name){
    var sort = authorRowSort[name] || {field: 'added', dir: 'desc'};
    var fields = [
      {field: 'title', label: 'Title'},
      {field: 'added', label: 'Date Added'},
      {field: 'updated', label: 'Updated'},
      {field: 'words', label: 'Word Count'}
    ];
    var btns = fields.map(function(f){
      if (f.field === sort.field){
        var arrow = sort.dir === 'asc' ? '\u2191' : '\u2193';
        return '<button type="button" class="author-sort-btn active" data-field="' + f.field + '"><span class="arrow">' + arrow + '</span>' + escapeHtml(f.label) + '</button>';
      }
      return '<button type="button" class="author-sort-btn" data-field="' + f.field + '">' + escapeHtml(f.label) + '</button>';
    }).join('');
    return '<div class="author-panel-sort author-row-sort" data-author="' + escapeHtml(name) + '">' + btns + '</div>';
  }
  // Stories currently exempt from tag-exclusion filtering: when a user
  // excludes a tag from within a story's own expanded tag list, that story
  // would otherwise vanish out from under them mid-click. Exempting it here
  // keeps it visible until they deliberately collapse the entry, at which
  // point the exclusion takes effect normally.
  var exemptFromExclusion = new Set();

  function tagButtonHtml(code){
    var label = tagLabels[code] || code;
    var chip = chips[code];
    var state = chip ? chip.dataset.state : 'none';
    var cls = 'tag-chip' + (state === 'include' ? ' active' : state === 'exclude' ? ' excluded' : '');
    return '<button type="button" class="' + cls + '" data-code="' + code + '">' + escapeHtml(label) + '</button>';
  }

  function renderList(list){
    var slice = list.slice(0, shown);
    resultsEl.innerHTML = slice.map(function(s){
      var metaHtml, synopsisHtml = '';
      var isExpanded = expandedSet.has(s.href);

      if ('words' in s){
        var bits = [];
        if (s.author) bits.push('by <button type="button" class="author-link" data-author="' + escapeHtml(s.author) + '">' + escapeHtml(s.author) + '</button>');
        var added = fmtDate(s.date_added);
        var updated = fmtDate(s.date_updated);
        if (updated) bits.push('Updated ' + updated);
        else if (added) bits.push('Added ' + added);
        var chapCount = s.chapters ? s.chapters.length : 0;
        bits.push(chapCount + (chapCount === 1 ? ' chapter' : ' chapters'));
        bits.push(s.words.toLocaleString() + ' words');
        metaHtml = bits.join('<span class="sep">\u00b7</span>');
        if (s.synopsis){
          var text = isExpanded ? s.synopsis : truncate(s.synopsis, 220);
          synopsisHtml = '<p class="synopsis">' + escapeHtml(text) + '</p>';
        }
      } else {
        metaHtml = '<span class="pending">details not yet available</span>';
      }

      if (isExpanded){
        if (s.tags && s.tags.length){
          synopsisHtml += '<div class="expanded-tags">' + s.tags.map(tagButtonHtml).join('') + '</div>';
        }
        synopsisHtml += '<a class="read-story-btn" href="' + storyUrl(s.href) + '" target="_blank" rel="noopener noreferrer">Read story \u2192</a>';
        if (s.chapters && s.chapters.length){
          synopsisHtml += '<div class="author-stories">' + s.chapters.map(function(ch){
            return '<a class="author-story-item chapter-link" href="' + storyUrl(ch.href) + '" target="_blank" rel="noopener noreferrer">' +
              '<div class="story-item-top">' +
                '<span class="story-item-name">' + escapeHtml(ch.name) + '</span>' +
                '<span class="meta-mini">' + ch.words.toLocaleString() + ' words</span>' +
              '</div>' +
            '</a>';
          }).join('') + '</div>';
        }
      }

      var indicator = s.synopsis ? (isExpanded ? '\u25b4 less' : '\u25be more') : '';
      var titleHtml = '<span class="name">' + escapeHtml(s.title) + '</span>';

      return '<div class="row' + (isExpanded ? ' expanded' : '') + '" data-href="' + escapeHtml(s.href) + '" tabindex="0" role="button" aria-expanded="' + isExpanded + '">' +
        bookmarkBtnHtml(s.href) +
        '<div class="row-top">' +
          titleHtml +
          '<span class="dash">\u2014</span>' +
          '<span class="meta">' + metaHtml + (indicator ? ' <span class="expand-indicator">' + indicator + '</span>' : '') + '</span>' +
        '</div>' +
        synopsisHtml +
      '</div>';
    }).join('');
    emptyEl.hidden = list.length !== 0;
    countEl.textContent = list.length.toLocaleString() + ' result' + (list.length===1?'':'s') +
      (shown < list.length ? ' \u00b7 showing first ' + Math.min(shown, list.length).toLocaleString() : '');
  }

  // Renders one expandable story entry used both in the full Authors view
  // and the author mini-panel, so expanding a story shows the same
  // synopsis, tags, and chapter list in either place.
  function storyItemHtml(s, isItemExpanded){
    // Line 1: date added · date updated. Line 2: chapter count · word count. Each line
    // is its own block with no-wrap pieces so "1 chapter" never splits.
    var addedStr = fmtDate(s.date_added);
    var chapCount = s.chapters ? s.chapters.length : 0;
    var line2Bits = [chapCount + (chapCount === 1 ? ' chapter' : ' chapters')];
    if ('words' in s) line2Bits.push(s.words.toLocaleString() + ' words');
    var metaHtml = '';
    var updatedStr = fmtDate(s.date_updated);
    var line1Bits = [];
    if (addedStr) line1Bits.push('Added ' + addedStr);
    if (updatedStr) line1Bits.push('Updated ' + updatedStr);
    if (line1Bits.length){
      metaHtml += '<span class="meta-line">' +
        line1Bits.map(function(b){ return '<span class="nowrap">' + b + '</span>'; })
                 .join('<span class="vsep" aria-hidden="true"></span>') +
        '</span>';
    }
    metaHtml += '<span class="meta-line">' +
      line2Bits.map(function(b){ return '<span class="nowrap">' + b + '</span>'; })
               .join('<span class="vsep" aria-hidden="true"></span>') +
      '</span>';
    var extra = '';
    if (isItemExpanded){
      var synHtml = s.synopsis ? '<p class="synopsis">' + escapeHtml(s.synopsis) + '</p>' : '';
      var tagsHtml = (s.tags && s.tags.length)
        ? '<div class="expanded-tags">' + s.tags.map(tagButtonHtml).join('') + '</div>'
        : '';
      var chaptersHtml = '';
      if (s.chapters && s.chapters.length){
        chaptersHtml = '<div class="author-stories">' + s.chapters.map(function(ch){
          return '<a class="author-story-item chapter-link" href="' + storyUrl(ch.href) + '" target="_blank" rel="noopener noreferrer">' +
            '<div class="story-item-top">' +
              '<span class="story-item-name">' + escapeHtml(ch.name) + '</span>' +
              '<span class="meta-mini">' + ch.words.toLocaleString() + ' words</span>' +
            '</div>' +
          '</a>';
        }).join('') + '</div>';
      }
      extra = synHtml + tagsHtml + '<a class="read-story-btn" href="' + storyUrl(s.href) + '" target="_blank" rel="noopener noreferrer">Read story \u2192</a>' + chaptersHtml;
    }
    var headHtml = '<div class="row-top">' +
      '<span class="name">' + escapeHtml(s.title) + '</span>' +
      '<span class="dash">\u2014</span>' +
      '<span class="meta">' + metaHtml + '</span>' +
    '</div>';
    return '<div class="author-story-item' + (isItemExpanded ? ' expanded' : '') + '" data-href="' + escapeHtml(s.href) + '" tabindex="0" role="button" aria-expanded="' + isItemExpanded + '">' +
      bookmarkBtnHtml(s.href, 'small') +
      headHtml +
      extra +
    '</div>';
  }

  function renderAuthorList(list){
    var slice = list.slice(0, shown);

    // Re-rendering replaces .author-stories (an internally-scrolling list),
    // which would otherwise reset its scroll position to the top. Capture
    // and restore it so expanding/collapsing a story doesn't lose your place.
    var scrollPositions = {};
    resultsEl.querySelectorAll('.author-row').forEach(function(row){
      var inner = row.querySelector('.author-stories');
      if (inner) scrollPositions[row.dataset.author] = inner.scrollTop;
    });

    resultsEl.innerHTML = slice.map(function(entry){
      var isExpanded = false; // rows never expand; clicking opens the sidebar

      var bits = [];
      bits.push(entry.count + (entry.count === 1 ? ' story' : ' stories'));
      bits.push(entry.totalWords.toLocaleString() + ' words total');
      if (entry.latestAdded !== null) bits.push('Latest ' + fmtDays(entry.latestAdded));
      var metaHtml = bits.join('<span class="sep">\u00b7</span>');

      var indicator = 'view stories \u203a';

      var storiesHtml = '';
      if (isExpanded){
        var rowSort = authorRowSort[entry.name];
        var rowStories = entry.stories;
        if (rowSort && rowSort.field){
          rowStories = rowStories.slice().sort(function(a,b){
            var va = authorPanelSortValue(a, rowSort.field), vb = authorPanelSortValue(b, rowSort.field);
            var cmp = va < vb ? -1 : (va > vb ? 1 : 0);
            return rowSort.dir === 'asc' ? cmp : -cmp;
          });
        }
        storiesHtml = '<div class="author-stories has-sort">' + authorRowSortButtonsHtml(entry.name) +
          rowStories.map(function(s){
            return storyItemHtml(s, authorStoryExpandedSet.has(s.href));
          }).join('') + '</div>';
      }

      return '<div class="row author-row' + (isExpanded ? ' expanded' : '') + '" data-author="' + escapeHtml(entry.name) + '" tabindex="0" role="button" aria-expanded="' + isExpanded + '">' +
        authorBookmarkBtnHtml(entry.name) +
        '<div class="row-top">' +
          '<span class="name">' + escapeHtml(entry.name) + '</span>' +
          '<span class="dash">\u2014</span>' +
          '<span class="meta">' + metaHtml + ' <span class="expand-indicator">' + indicator + '</span></span>' +
        '</div>' +
        storiesHtml +
      '</div>';
    }).join('');

    resultsEl.querySelectorAll('.author-row').forEach(function(row){
      var pos = scrollPositions[row.dataset.author];
      if (pos){
        var inner = row.querySelector('.author-stories');
        if (inner) inner.scrollTop = pos;
      }
    });

    emptyEl.hidden = list.length !== 0;
    countEl.textContent = list.length.toLocaleString() + ' author' + (list.length===1?'':'s') +
      (shown < list.length ? ' \u00b7 showing first ' + Math.min(shown, list.length).toLocaleString() : '');
  }

  resultsEl.addEventListener('click', function(e){
    var authorLink = e.target.closest('.author-link');
    if (authorLink){
      e.stopPropagation();
      var linkRow = authorLink.closest('.row');
      openAuthorPanel(authorLink.dataset.author, linkRow ? linkRow.dataset.href : null);
      return;
    }

    var bookmarkBtn = e.target.closest('.bookmark-btn');
    if (bookmarkBtn){
      if (bookmarkBtn.classList.contains('author-bookmark-btn')){
        toggleAuthorBookmark(bookmarkBtn.dataset.author);
        // With no Saved filter on, just redraw the rows in place (keeps the
        // list as far down as it's been loaded); otherwise re-filter.
        if (savedStateByMode.authors === 'none') renderAuthorList(currentAuthorList);
        else render();
        return;
      }
      toggleBookmark(bookmarkBtn.dataset.href);
      render();
      return;
    }

    if (viewMode === 'authors'){
      var authorRow = e.target.closest('.author-row');
      if (!authorRow) return;

      var rowSortBtn = e.target.closest('.author-row-sort .author-sort-btn');
      if (rowSortBtn){
        e.stopPropagation();
        var rowSortName = authorRow.dataset.author;
        var field = rowSortBtn.dataset.field;
        var current = authorRowSort[rowSortName] || {field: 'added', dir: 'desc'};
        if (current.field !== field){
          authorRowSort[rowSortName] = {field: field, dir: 'desc'};
        } else if (current.dir === 'desc'){
          authorRowSort[rowSortName] = {field: field, dir: 'asc'};
        } else {
          delete authorRowSort[rowSortName];
        }
        renderAuthorList(currentAuthorList);
        return;
      }

      var tagBtn2 = e.target.closest('.tag-chip');
      if (tagBtn2){
        var ownerItem2 = tagBtn2.closest('.author-story-item[data-href]');
        cycleTagState(tagBtn2.dataset.code);
        updateGroupBadges();
        // Same exploratory exemption as the main list: don't let a story
        // vanish out of its author's list mid-click just because you
        // excluded one of its own tags.
        if (ownerItem2) exemptFromExclusion.add(ownerItem2.dataset.href);
        render();
        return;
      }

      var storyItem = e.target.closest('.author-story-item:not(.chapter-link)');
      if (storyItem){
        if (e.target.closest('a.chapter-link') || e.target.closest('.read-story-btn')) return; // let chapter links navigate
        var storyHref = storyItem.dataset.href;
        if (authorStoryExpandedSet.has(storyHref)){
          authorStoryExpandedSet.delete(storyHref);
          if (exemptFromExclusion.has(storyHref)){
            exemptFromExclusion.delete(storyHref);
            render();
            return;
          }
        } else {
          authorStoryExpandedSet.add(storyHref);
        }
        renderAuthorList(currentAuthorList);
        return;
      }

      if (e.target.closest('.author-stories')){
        return; // clicked empty space in the scroll area, not on an item - ignore so scrolling never closes anything
      }
      // Authors no longer expand in place; the sidebar is the author page.
      openAuthorPanel(authorRow.dataset.author, null);
      return;
    }

    var tagBtn = e.target.closest('.tag-chip');
    if (tagBtn){
      var ownerRow = tagBtn.closest('.row[data-href]');
      cycleTagState(tagBtn.dataset.code);
      updateGroupBadges();
      // Clicking a tag from within a story's own expanded tag list is
      // exploratory - keep that story visible even if the tag is now
      // excluded, so it doesn't disappear mid-click. It'll be re-filtered
      // normally once the user collapses it.
      if (ownerRow) exemptFromExclusion.add(ownerRow.dataset.href);
      render();
      return;
    }
    if (e.target.closest('.author-stories') || e.target.closest('.read-story-btn')) return;
    var row = e.target.closest('.row');
    if (!row) return;
    var href = row.dataset.href;
    if (expandedSet.has(href)){
      expandedSet.delete(href);
      if (href === authorPanelTriggerHref) closeAuthorPanel();
      if (exemptFromExclusion.has(href)){
        // Collapsing re-exposes it to the tag-exclusion filter, so a story
        // excluded while expanded now drops out of the list as expected.
        exemptFromExclusion.delete(href);
        render();
        return;
      }
    } else {
      expandedSet.add(href);
    }
    renderList(currentFiltered);
  });

  resultsEl.addEventListener('keydown', function(e){
    if (e.key !== 'Enter' && e.key !== ' ') return;

    if (viewMode === 'authors'){
      var storyItem = e.target.closest('.author-story-item:not(.chapter-link)');
      if (storyItem && e.target === storyItem){
        e.preventDefault();
        var storyHref = storyItem.dataset.href;
        if (authorStoryExpandedSet.has(storyHref)) authorStoryExpandedSet.delete(storyHref);
        else authorStoryExpandedSet.add(storyHref);
        renderAuthorList(currentAuthorList);
        return;
      }
      var authorRow = e.target.closest('.author-row');
      if (!authorRow || e.target !== authorRow) return;
      e.preventDefault();
      openAuthorPanel(authorRow.dataset.author, null);
      return;
    }

    var row = e.target.closest('.row');
    if (!row || e.target !== row) return;
    e.preventDefault();
    var href = row.dataset.href;
    if (expandedSet.has(href)){
      expandedSet.delete(href);
      if (href === authorPanelTriggerHref) closeAuthorPanel();
    } else {
      expandedSet.add(href);
    }
    renderList(currentFiltered);
  });

  function escapeHtml(str){
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function render(){
    shown = pageSize;
    updateScopeToggle();
    updateSavedToggleLabel();
    if (viewMode === 'authors'){
      var pool = applyFilters();
      currentAuthorList = sortAuthorList(buildAuthorList(pool));
      renderAuthorList(currentAuthorList);
    } else {
      currentFiltered = filterStories();
      renderList(currentFiltered);
    }
    var active = activeTags();
    var excluded = excludedTags();
    var rangesActive = wordFilter.active || addedFilter.active || updatedFilter.active;
    clearBtn.hidden = active.length === 0 && excluded.length === 0 && !searchInput.value.trim() && !rangesActive;
  }

  var debounceTimer;
  searchInput.addEventListener('input', function(){
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(render, 120);
  });

  clearBtn.addEventListener('click', function(){
    searchInput.value = '';
    tagCodes.forEach(function(c){
      chips[c].dataset.state = 'none';
      chips[c].classList.remove('active', 'excluded');
    });
    exemptFromExclusion.clear();
    updateGroupBadges();
    wordsSlider.reset(); wordFilter = {lo: wMin, hi: wMax, active: false};
    addedSlider.reset(); addedFilter = {lo: aMin, hi: aMax, active: false};
    updatedSlider.reset(); updatedFilter = {lo: uMin, hi: uMax, active: false};
    render();
  });

  render();
  } // end init()
})();
</script>
</body>
</html>
