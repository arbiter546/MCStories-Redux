<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Browse Stories — The Erotic Mind-Control Story Archive</title>
<meta name="description" content="Every story in the archive, one page, filterable by category and sortable by title, date, or length."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15120e;
    --ink-2:#1d1912;
    --ink-3:#242018;
    --ink-4:#2f2a20;
    --parchment:#ede3cf;
    --parchment-dim:#c9bfa8;
    --brass:#a8823e;
    --brass-bright:#d9b46a;
    --muted:#9c948a;
    --focus:#d9b46a;
    --line:#3a3327;
  }

  *{ box-sizing:border-box; }
  html{ background:var(--ink); }

  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, #241d13 0%, transparent 60%),
      var(--ink);
    color:var(--parchment);
    font-family:'Source Serif 4', Georgia, serif;
    line-height:1.5;
  }

  a{ color:inherit; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, .row:focus-visible, summary:focus-visible, .author-story-item:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:2px;
    border-radius:2px;
  }

  .wrap{
    max-width:1280px;
    margin:0 auto;
    padding:3rem 1.5rem 4rem;
    transition:margin-left .3s ease;
  }

  header{ margin-bottom:1.5rem; }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:.72rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 .6rem;
  }

  header a.back{ text-decoration:none; color:var(--muted); }
  header a.back:hover{ color:var(--parchment); }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(1.7rem, 4vw, 2.4rem);
    line-height:1.1;
    margin:.3rem 0 .5rem;
    letter-spacing:-.01em;
  }

  .subhead{ color:var(--parchment-dim); font-size:.95rem; margin:0; }

  /* --- Two-column page layout --- */
  .page{
    display:flex;
    gap:2rem;
    align-items:flex-start;
  }

  .main-col{
    flex:1;
    min-width:0;
  }

  .sidebar{
    width:300px;
    flex-shrink:0;
    position:sticky;
    top:0;
    max-height:100vh;
    overflow-y:auto;
    padding:1.25rem 0 2rem 1.25rem;
    border-left:1px solid var(--line);
  }

  @media (max-width:900px){
    .page{ flex-direction:column; }
    .sidebar{
      width:100%;
      position:static;
      max-height:none;
      overflow-y:visible;
      border-left:none;
      border-top:1px solid var(--line);
      padding:1.25rem 0 0;
      margin-top:1.5rem;
    }
  }

  /* --- Author mini-portfolio panel ---
     Slides in from the left and pushes .wrap to the right (eating into
     what was the centered page's right-hand whitespace) rather than
     overlaying the page, so search/filters stay visible and usable. */
  .author-panel{
    position:fixed;
    top:0; left:0; bottom:0;
    width:380px;
    max-width:88vw;
    background:var(--ink-2);
    border-right:1px solid var(--line);
    box-shadow:12px 0 28px rgba(0,0,0,.45);
    z-index:60;
    transform:translateX(-100%);
    transition:transform .3s ease;
    overflow-y:auto;
    padding:1.5rem 1.35rem 2rem;
    display:flex;
    flex-direction:column;
    gap:1rem;
  }
  .author-panel.open{ transform:translateX(0); }

  /* Push the whole page over to the opposite (right) edge of the screen
     rather than just nudging it — drop the centering max-width so .wrap
     fills all the way from the panel to the right side of the viewport. */
  body.author-panel-open .wrap{ margin-left:380px; margin-right:0; max-width:none; }

  .author-panel-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:.75rem;
  }
  .author-panel-eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 .3rem;
  }
  .author-panel-head h2{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:600;
    font-size:1.25rem;
    margin:0;
    line-height:1.25;
  }
  .author-panel-namerow{
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    column-gap:.75rem;
  }
  .author-panel-link{
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    letter-spacing:.05em;
    color:var(--brass-bright);
    text-decoration:none;
    white-space:nowrap;
    opacity:0;
    transition:opacity .15s ease;
  }
  .author-panel-link:hover{ text-decoration:underline; }
  /* Revealed when hovering the name row or tabbing to the link; always shown
     on touch devices, which have no hover. */
  .author-panel-namerow:hover .author-panel-link,
  .author-panel-link:focus-visible{ opacity:1; }
  @media (hover:none){ .author-panel-link{ opacity:1; } }
  .author-panel-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:.7rem;
    color:var(--muted);
    margin:.4rem 0 0;
  }
  .author-panel-head-actions{
    display:flex;
    align-items:center;
    gap:.4rem;
    flex-shrink:0;
  }
  .author-panel-bookmark{
    flex-shrink:0;
    width:30px;
    height:30px;
    border-radius:50%;
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    cursor:pointer;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:0;
  }
  .author-panel-bookmark svg{ width:14px; height:14px; display:block; }
  .author-panel-bookmark:hover{ color:var(--parchment); border-color:var(--brass); }
  .author-panel-bookmark.active{ color:var(--brass-bright); border-color:var(--brass); }
  .author-panel-close{
    flex-shrink:0;
    width:30px;
    height:30px;
    border-radius:50%;
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    font-size:1.1rem;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .author-panel-close:hover{ color:var(--parchment); border-color:var(--brass); }

  .author-panel-sort{
    display:flex;
    flex-wrap:nowrap;
    gap:.3rem;
  }
  .author-sort-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    letter-spacing:.01em;
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    padding:.3rem .4rem;
    min-height:31px;
    border-radius:2px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex:1 1 auto;
    min-width:0;
    white-space:nowrap;
    gap:.25rem;
  }
  .author-sort-btn:hover{ color:var(--parchment); border-color:var(--brass); }
  .author-sort-btn.active{
    background:none;
    border-color:var(--brass);
    color:var(--brass-bright);
    font-weight:500;
  }
  .author-sort-btn .arrow{ font-size:.7rem; line-height:1; }

  .author-panel-list{
    display:flex;
    flex-direction:column;
    gap:.3rem;
    border-top:1px solid var(--line);
    padding-top:.5rem;
  }
  /* Reuses the .author-story-item styling from the full Authors view so an
     item expands in place to show its synopsis, tags, and chapters. */
  .author-panel-list .author-story-item{ padding-right:2.9rem; }

  #author-panel-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:55;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }

  @media (max-width:700px){
    .author-panel{ width:100%; max-width:100%; }
    body.author-panel-open .wrap{ margin-left:0; }
    #author-panel-backdrop.show{ opacity:1; pointer-events:auto; }
  }

  /* --- Main column controls --- */
  .controls-main{
    position:sticky;
    top:0;
    z-index:10;
    background:
      linear-gradient(var(--ink) 88%, transparent),
      var(--ink);
    padding:1.25rem 0 1rem;
    margin-bottom:1.5rem;
    border-bottom:1px solid var(--line);
  }

  @media (max-width:900px){
    .controls-main{ position:static; background:none; }
  }

  .search-row{
    display:flex;
    gap:.75rem;
    flex-wrap:wrap;
    align-items:center;
  }

  #search{
    flex:1 1 220px;
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--parchment);
    font-family:'Source Serif 4', Georgia, serif;
    font-size:1rem;
    padding:.65rem .9rem;
    border-radius:2px;
  }
  #search::placeholder{ color:var(--muted); }
  #search:focus-visible{ border-color:var(--brass); }

  .sort-group{
    display:flex;
    align-items:center;
    gap:.5rem;
    font-family:'IBM Plex Mono', monospace;
    font-size:.78rem;
  }

  .sort-group label{ color:var(--muted); }

  select{
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--parchment);
    font-family:'IBM Plex Mono', monospace;
    font-size:.78rem;
    padding:.5rem .6rem;
    border-radius:2px;
  }

  .mode-toggle{
    display:inline-flex;
    border:1px solid var(--line);
    border-radius:2px;
    overflow:hidden;
  }
  .mode-toggle button{
    font-family:'IBM Plex Mono', monospace;
    font-size:.72rem;
    letter-spacing:.05em;
    background:var(--ink-2);
    color:var(--muted);
    border:none;
    padding:.5rem .7rem;
    cursor:pointer;
  }
  .mode-toggle button.active{
    background:var(--brass);
    color:var(--ink);
    font-weight:500;
  }

  /* --- Sidebar: match toggle --- */
  .sidebar-top{
    margin-bottom:1rem;
    /* Nudges the Match toggle down to line up with the Stories/Authors
       toggle, which sits vertically centered against the taller search
       input in its row rather than flush with the top padding. */
    margin-top:.35rem;
  }
  .sidebar-top .sort-group{ justify-content:space-between; width:100%; }

  .tag-hint{
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    color:var(--muted);
    margin:0 0 .8rem;
    line-height:1.4;
  }

  /* --- Tag group dropdowns --- */
  .tag-groups{
    display:flex;
    flex-direction:column;
    gap:.5rem;
    margin-bottom:1.5rem;
  }

  .tag-group{
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--ink-2);
  }
  .tag-group[open]{ border-color:#4a4130; }

  .tag-group summary{
    cursor:pointer;
    list-style:none;
    padding:.65rem .8rem;
    font-family:'IBM Plex Mono', monospace;
    font-size:.76rem;
    letter-spacing:.03em;
    color:var(--parchment-dim);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .tag-group summary::-webkit-details-marker{ display:none; }
  .tag-group summary:hover{ color:var(--parchment); }

  .summary-right{ display:flex; align-items:center; gap:.5rem; }

  .group-badge{
    background:var(--brass);
    color:var(--ink);
    font-size:.66rem;
    font-weight:600;
    padding:.05rem .4rem;
    border-radius:10px;
    display:none;
    line-height:1.4;
  }
  .group-badge.show{ display:inline-block; }

  .chevron{
    color:var(--muted);
    transition:transform .2s ease;
    font-size:.7rem;
  }
  .tag-group[open] .chevron{ transform:rotate(90deg); }

  .tag-group .tag-row{
    display:flex;
    flex-direction:column;
    gap:.35rem;
    padding:.5rem .7rem .75rem;
    border-top:1px solid var(--line);
  }

  .tag-chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:.72rem;
    line-height:1.3;
    background:var(--ink);
    border:1px solid var(--line);
    color:var(--parchment-dim);
    padding:.45rem .6rem;
    border-radius:2px;
    cursor:pointer;
    user-select:none;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:.6rem;
    text-align:left;
  }
  .tag-chip:hover{ border-color:var(--brass); color:var(--parchment); }
  .tag-chip.active{
    background:var(--brass);
    border-color:var(--brass);
    color:var(--ink);
    font-weight:500;
  }
  .tag-chip.excluded{
    background:var(--ink);
    border-color:#7a2a2a;
    color:#c98c8c;
    text-decoration:line-through;
    text-decoration-color:#7a2a2a;
  }
  .tag-chip.excluded:hover{ border-color:#a34848; color:#e0a3a3; }
  .tag-chip .count{ opacity:.65; font-size:.9em; flex-shrink:0; }
  .tag-chip.active .count{ opacity:.75; }
  .tag-chip.excluded .count{ opacity:.6; }

  /* --- Sort dropdowns (sidebar) --- */
  .sort-content{
    display:flex;
    flex-direction:column;
    gap:.65rem;
    padding:.6rem .8rem .8rem;
    border-top:1px solid var(--line);
  }

  .sort-badge{ text-transform:none; }

  .range-slider{
    position:relative;
    height:1.4rem;
    margin-bottom:.3rem;
  }

  .range-slider .track{
    position:absolute;
    top:50%; left:0; right:0;
    height:3px;
    background:var(--line);
    transform:translateY(-50%);
    border-radius:2px;
  }
  .range-slider .track-fill{
    position:absolute;
    top:50%; height:3px;
    background:var(--brass);
    transform:translateY(-50%);
    border-radius:2px;
  }

  .range-slider input[type="range"]{
    position:absolute;
    left:0; top:50%;
    width:100%;
    transform:translateY(-50%);
    margin:0;
    background:transparent;
    -webkit-appearance:none;
    appearance:none;
    pointer-events:none;
    height:0;
  }
  .range-slider input[type="range"]::-webkit-slider-thumb{
    pointer-events:auto;
    -webkit-appearance:none;
    appearance:none;
    width:14px; height:14px;
    border-radius:50%;
    background:var(--brass-bright);
    border:2px solid var(--ink);
    cursor:pointer;
    margin-top:0;
  }
  .range-slider input[type="range"]::-moz-range-thumb{
    pointer-events:auto;
    width:14px; height:14px;
    border-radius:50%;
    background:var(--brass-bright);
    border:2px solid var(--ink);
    cursor:pointer;
  }
  .range-slider input[type="range"]::-moz-range-track{ background:transparent; border:none; }

  .range-labels{
    display:flex;
    justify-content:space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size:.7rem;
    color:var(--parchment-dim);
  }

  .clear-link{
    font-family:'IBM Plex Mono', monospace;
    font-size:.74rem;
    color:var(--muted);
    background:none;
    border:none;
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
    padding:.4rem 0;
  }
  .clear-link:hover{ color:var(--parchment); }

  .status-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:1rem;
    font-family:'IBM Plex Mono', monospace;
    font-size:.78rem;
    color:var(--muted);
  }

  .status-row-right{
    display:flex;
    align-items:center;
    gap:.9rem;
    margin-left:auto;
  }
  .status-row-right .clear-link{ padding:.2rem 0; }
  /* Search-scope toggle: same segmented look and size as Stories/Authors.
     Each button is given the same fixed width those two buttons end up with
     (their labels are the same length), so Title/Synopsis match instead of
     sizing to their own text. */
  /* Slides open/closed when switching between Stories and Authors. The
     width animates (and the search bar flexes to fill the space); the
     negative margin cancels the row gap so no empty gap is left behind. */
  .scope-toggle{
    max-width:calc(9.35rem + 2px);
    opacity:1;
    transition:max-width .3s ease, opacity .2s ease, margin-left .3s ease, border-width .3s ease;
  }
  .scope-toggle.collapsed{
    max-width:0;
    opacity:0;
    margin-left:-.75rem;
    border-width:0;
    pointer-events:none;
  }
  @media (prefers-reduced-motion: reduce){
    .scope-toggle{ transition:none; }
  }
  .scope-toggle button{ width:4.675rem; padding-left:0; padding-right:0; }

  /* --- Results --- */
  #results{ display:grid; grid-template-columns:1fr; gap:.4rem; }

  .row{
    display:block;
    position:relative;
    padding:.85rem 3.15rem .85rem .95rem;
    border:1px solid var(--line);
    border-radius:2px;
    background:var(--ink-2);
    margin-bottom:.4rem;
    cursor:pointer;
  }
  .row:hover{ border-color:var(--brass); }
  .row.expanded{ border-color:var(--brass); }

  .row-top{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    gap:.5rem;
  }

  .row .name{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:1.08rem;
    color:var(--parchment);
    text-decoration:none;
    flex-shrink:0;
  }

  /* --- Bookmarks --- */
  .bookmark-btn{
    position:absolute;
    top:-9px;
    right:1.2rem;
    width:34px;
    height:40px;
    background:var(--ink-3);
    border:1px solid var(--line);
    border-top:none;
    border-radius:0 0 4px 4px;
    box-shadow:0 4px 7px rgba(0,0,0,.4);
    color:var(--muted);
    cursor:pointer;
    padding:0 0 .4rem;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    line-height:0;
    flex-shrink:0;
    transition:background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease;
  }
  .bookmark-btn svg{ width:19px; height:19px; display:block; }
  .bookmark-btn:hover{ color:var(--brass-bright); border-color:var(--brass); }
  .bookmark-btn:active{ transform:translateY(1px); }
  .bookmark-btn.active{ background:var(--brass); border-color:var(--brass); color:var(--ink); }
  .bookmark-btn.active:hover{ background:var(--brass-bright); border-color:var(--brass-bright); }
  /* .small variant lives in the author lists (author page + sidebar). Those
     are scrollable, borderless rows, so the tab hangs from the item's own top
     edge (top:0, not negative) to avoid being clipped by the scroll area.
     Same ribbon look as the main list, just a little smaller. */
  .bookmark-btn.small{
    top:0; right:.5rem;
    width:28px; height:38px;
    background:var(--ink-4);
    border:1px solid var(--line);
    border-top:none;
    border-radius:0 0 4px 4px;
    box-shadow:0 3px 6px rgba(0,0,0,.4);
    padding:0 0 .45rem;
    align-items:flex-end;
  }
  .bookmark-btn.small svg{ width:16px; height:16px; }
  .bookmark-btn.small:hover{ color:var(--brass-bright); border-color:var(--brass); }
  .bookmark-btn.small.active{ background:var(--brass); border-color:var(--brass); color:var(--ink); }
  .bookmark-btn.small.active:hover{ background:var(--brass-bright); border-color:var(--brass-bright); }

  .saved-toggle{
    font-family:'IBM Plex Mono', monospace;
    font-size:.78rem;
    letter-spacing:.02em;
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--muted);
    padding:.6rem .8rem;
    border-radius:2px;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    gap:.4rem;
  }
  .saved-toggle svg{ width:14px; height:14px; flex-shrink:0; }
  .saved-toggle:hover{ color:var(--parchment); border-color:var(--brass); }
  .saved-toggle.active{
    background:var(--brass);
    border-color:var(--brass);
    color:var(--ink);
    font-weight:500;
  }
  .saved-toggle.excluded{
    background:var(--ink);
    border-color:#7a2a2a;
    color:#c98c8c;
  }
  .saved-toggle.excluded:hover{ border-color:#a34848; color:#e0a3a3; }

  .row .dash, .author-story-item > .row-top .dash{
    color:var(--line);
    flex-shrink:0;
  }

  .row .expand-indicator{
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    color:var(--muted);
    flex-shrink:0;
  }

  .row .meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:.72rem;
    color:var(--brass);
    letter-spacing:.01em;
    min-width:0;
  }

  .author-story-item > .row-top .meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:.72rem;
    color:var(--parchment-dim);
    letter-spacing:.01em;
    min-width:0;
  }

  .row .meta .sep, .author-story-item > .row-top .meta .sep{ color:var(--line); margin:0 .45em; }
  .row .meta .pending{ color:var(--muted); font-style:italic; }

  /* Top-level story entries in the author view reuse the main list's
     title-dash-meta header line, just at the smaller author-list scale. */
  .author-story-item > .row-top{ flex-wrap:wrap; }
  .author-story-item > .row-top .dash{ display:none; }
  .author-story-item > .row-top .meta{ flex:0 0 100%; }
  .author-story-item > .row-top .meta .meta-line{ display:block; }
  .author-story-item > .row-top .meta .nowrap{ white-space:nowrap; }
  .author-story-item > .row-top .meta .vsep{
    display:inline-block;
    width:3px;
    height:3px;
    border-radius:50%;
    margin:0 .7em;
    background:var(--brass);
    opacity:.6;
    vertical-align:.25em;
  }
  .author-story-item > .row-top .name{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:.92rem;
    color:var(--parchment);
    text-decoration:none;
    flex-shrink:0;
  }

  .author-link{
    font:inherit;
    color:var(--brass-bright);
    font-weight:500;
    background:none;
    border:none;
    padding:0;
    margin:0;
    cursor:pointer;
    text-decoration:underline;
    text-decoration-color:transparent;
    text-underline-offset:2px;
    transition:text-decoration-color .15s ease, color .15s ease;
  }
  .author-link:hover, .author-link:focus-visible{
    color:var(--brass-bright);
    text-decoration-color:var(--brass-bright);
  }

  .row .synopsis{
    font-size:.88rem;
    color:var(--parchment-dim);
    margin:.4rem 0 0;
    line-height:1.4;
  }

  .expanded-tags{
    display:flex;
    flex-wrap:wrap;
    gap:.4rem;
    margin-top:.65rem;
  }
  .expanded-tags .tag-chip{
    display:inline-flex;
    width:auto;
    border-radius:20px;
    padding:.35rem .7rem;
    font-size:.7rem;
  }

  /* --- Author view --- */
  .author-row .expand-indicator{ color:var(--brass-bright); }

  .author-stories{
    margin-top:.65rem;
    max-height:320px;
    overflow-y:auto;
    border-top:1px solid var(--line);
    padding-top:.5rem;
    display:flex;
    flex-direction:column;
    gap:.3rem;
  }

  /* On the author page the sort buttons come first, so the divider goes
     below them (between the buttons and the story list) instead of above. */
  .author-stories.has-sort{
    border-top:none;
    padding-top:0;
  }
  /* Author-page sort buttons: fixed-ish width instead of stretching across
     the whole row (the sidebar's buttons are unaffected). */
  .author-row-sort .author-sort-btn{ flex:0 1 9.25rem; }
  .author-stories.has-sort > .author-row-sort{
    padding-bottom:.6rem;
    margin-bottom:.2rem;
    border-bottom:1px solid var(--line);
  }

  .author-story-item{
    display:block;
    position:relative;
    padding:.4rem 2.9rem .4rem .2rem;
    border-radius:2px;
    cursor:pointer;
  }
  .author-story-item:hover{ background:var(--ink-3); }
  a.author-story-item.chapter-link{ color:inherit; text-decoration:none; }
  .author-story-item.expanded{ background:var(--ink-3); }
  /* Chapters live inside an expanded story item, which already uses --ink-3,
     so the normal hover color was invisible there. Use a lighter shade. */
  .author-story-item.expanded .chapter-link:hover,
  .author-story-item.expanded .chapter-link:focus-visible{ background:var(--ink-4); }

  .story-item-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:.75rem;
  }

  .author-story-item .story-item-name{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:.92rem;
    color:var(--parchment);
    text-decoration:none;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .author-story-item .meta-mini{
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    color:var(--muted);
    white-space:nowrap;
    flex-shrink:0;
  }

  .author-story-item .synopsis{ margin-top:.4rem; }
  .author-story-item .expanded-tags{ margin-top:.5rem; }


  .read-story-btn{
    display:inline-flex;
    align-items:center;
    gap:.35rem;
    margin-top:.65rem;
    font-family:'IBM Plex Mono', monospace;
    font-size:.72rem;
    letter-spacing:.05em;
    background:var(--brass);
    color:var(--ink);
    font-weight:500;
    border:none;
    border-radius:999px;
    padding:.5rem 1rem;
    text-decoration:none;
    cursor:pointer;
  }
  .read-story-btn:hover{ background:var(--brass-bright); }

  .empty-state{
    text-align:center;
    padding:3rem 1rem;
    color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
    font-size:.85rem;
  }

  #sentinel{ height:1px; }

  footer{
    border-top:1px solid var(--line);
    margin-top:2.5rem;
    padding-top:1.25rem;
    font-family:'IBM Plex Mono', monospace;
    font-size:.78rem;
    color:var(--muted);
    text-align:center;
  }
</style>
</head>
<body>

<div id="author-panel-backdrop"></div>
<aside id="author-panel" class="author-panel" aria-hidden="true">
  <div class="author-panel-head">
    <div>
      <p class="author-panel-eyebrow">Author</p>
      <div class="author-panel-namerow">
        <h2 id="author-panel-name"></h2>
        <a id="author-panel-link" class="author-panel-link" href="#" target="_blank" rel="noopener noreferrer" title="Open this author's page on mcstories.com">Author page &#8599;</a>
      </div>
      <p class="author-panel-meta" id="author-panel-meta"></p>
    </div>
    <div class="author-panel-head-actions">
      <button type="button" class="author-panel-bookmark" id="author-panel-bookmark" aria-pressed="false" aria-label="Bookmark this author" title="Bookmark this author"></button>
      <button type="button" class="author-panel-close" id="author-panel-close" aria-label="Close">&times;</button>
    </div>
  </div>
  <div class="author-panel-sort" id="author-panel-sort">
    <button type="button" class="author-sort-btn" data-field="title">Title</button>
    <button type="button" class="author-sort-btn" data-field="added">Date Added</button>
    <button type="button" class="author-sort-btn" data-field="updated">Updated</button>
    <button type="button" class="author-sort-btn" data-field="words">Word Count</button>
  </div>
  <div class="author-panel-list" id="author-panel-list"></div>
</aside>

<div class="wrap">


  <header>
    <p class="eyebrow"><a class="back" href="https://mcstories.com/index.html" target="_blank" rel="noopener noreferrer">← The Archive</a></p>
    <h1 id="pagetitle">Browse every story</h1>
    <p class="subhead" id="totalcount"></p>
  </header>

  <div class="page">

    <div class="main-col">
      <div class="controls-main">
        <div class="search-row">
          <input type="text" id="search" placeholder="Search titles…" autocomplete="off"/>
          <div class="mode-toggle scope-toggle" id="scope-toggle" role="group" aria-label="Search in">
            <button type="button" id="scope-title" class="active">Title</button>
            <button type="button" id="scope-synopsis">Synopsis</button>
          </div>
          <div class="mode-toggle" role="group" aria-label="Browse by">
            <button type="button" id="view-stories" class="active">Stories</button>
            <button type="button" id="view-authors">Authors</button>
          </div>
        </div>
      </div>

      <div class="status-row">
        <span id="resultcount"></span>
        <div class="status-row-right">
          <button type="button" class="clear-link" id="clearall" hidden>Clear filters</button>
          <button type="button" id="saved-toggle" class="saved-toggle" aria-pressed="false"><span class="saved-toggle-icon"></span><span class="saved-toggle-label">Saved</span></button>
        </div>
      </div>

      <div id="results"></div>
      <div class="empty-state" id="emptystate" hidden>No stories match those filters.</div>
      <div id="sentinel"></div>

      <footer>
        Data assembled from the archive's own category and story pages · tags are the site's, not ours to redefine
      </footer>
    </div>

    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sort-group">
          <span>Match</span>
          <div class="mode-toggle" role="group" aria-label="Tag match mode">
            <button type="button" id="mode-and" class="active">All tags</button>
            <button type="button" id="mode-or">Any tag</button>
          </div>
        </div>
      </div>

      <div class="tag-groups" id="sortgroups">

        <details class="tag-group sort-dd" data-field="title">
          <summary><span class="summary-label" data-stories-label="Sort: Title" data-authors-label="Sort: Author Name">Sort: Title</span>
            <span class="summary-right">
              <span class="group-badge sort-badge" data-field="title"></span>
              <span class="chevron">▸</span>
            </span>
          </summary>
          <div class="sort-content">
            <div class="mode-toggle dir-toggle" data-field="title" role="group" aria-label="Title sort direction">
              <button type="button" data-dir="desc">High → Low</button>
              <button type="button" data-dir="asc">Low → High</button>
            </div>
          </div>
        </details>

        <details class="tag-group sort-dd" data-field="words">
          <summary><span class="summary-label" data-stories-label="Sort: Word Count" data-authors-label="Sort: Total Words">Sort: Word Count</span>
            <span class="summary-right">
              <span class="group-badge sort-badge" data-field="words"></span>
              <span class="chevron">▸</span>
            </span>
          </summary>
          <div class="sort-content">
            <div class="mode-toggle dir-toggle" data-field="words" role="group" aria-label="Word count sort direction">
              <button type="button" data-dir="desc">High → Low</button>
              <button type="button" data-dir="asc">Low → High</button>
            </div>
            <div class="range-slider" id="slider-words">
              <div class="track"></div>
              <div class="track-fill"></div>
              <input type="range" class="thumb-min"/>
              <input type="range" class="thumb-max"/>
            </div>
            <div class="range-labels"><span id="words-min-label"></span><span id="words-max-label"></span></div>
          </div>
        </details>

        <details class="tag-group sort-dd" data-field="added" open>
          <summary><span class="summary-label" data-stories-label="Sort: Date Added" data-authors-label="Sort: Latest Story Added">Sort: Date Added</span>
            <span class="summary-right">
              <span class="group-badge sort-badge" data-field="added"></span>
              <span class="chevron">▸</span>
            </span>
          </summary>
          <div class="sort-content">
            <div class="mode-toggle dir-toggle" data-field="added" role="group" aria-label="Date added sort direction">
              <button type="button" data-dir="desc">High → Low</button>
              <button type="button" data-dir="asc">Low → High</button>
            </div>
            <div class="range-slider" id="slider-added">
              <div class="track"></div>
              <div class="track-fill"></div>
              <input type="range" class="thumb-min"/>
              <input type="range" class="thumb-max"/>
            </div>
            <div class="range-labels"><span id="added-min-label"></span><span id="added-max-label"></span></div>
          </div>
        </details>

        <details class="tag-group sort-dd" data-field="updated">
          <summary><span class="summary-label" data-stories-label="Sort: Date Updated" data-authors-label="Sort: Latest Story Updated">Sort: Date Updated</span>
            <span class="summary-right">
              <span class="group-badge sort-badge" data-field="updated"></span>
              <span class="chevron">▸</span>
            </span>
          </summary>
          <div class="sort-content">
            <div class="mode-toggle dir-toggle" data-field="updated" role="group" aria-label="Date updated sort direction">
              <button type="button" data-dir="desc">High → Low</button>
              <button type="button" data-dir="asc">Low → High</button>
            </div>
            <div class="range-slider" id="slider-updated">
              <div class="track"></div>
              <div class="track-fill"></div>
              <input type="range" class="thumb-min"/>
              <input type="range" class="thumb-max"/>
            </div>
            <div class="range-labels"><span id="updated-min-label"></span><span id="updated-max-label"></span></div>
          </div>
        </details>

      </div>

      <div class="tag-groups" id="taggroups"></div>
    </aside>

  </div>
</div>

<script>
(function(){
  var resultsEl = document.getElementById('results');

  resultsEl.innerHTML = '<div class="empty-state" id="loadingstate">Loading stories…</div>';

  fetch('stories.json')
    .then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data){
      init(data.stories, data.tags);
    })
    .catch(function(err){
      resultsEl.innerHTML = '<div class="empty-state">Couldn\u2019t load story data (' + escapeErr(err.message) +
        '). If you\u2019re opening this file directly from disk, try serving it from a local web server instead \u2014 ' +
        'browsers block this kind of file loading for security reasons when a page is opened as a plain file.</div>';
    });

  function escapeErr(str){
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function init(stories, tagDefs){
  var BOOKMARK_KEY = 'storyArchive.bookmarks.v1';
  // Authors have their own, separate saved list (keyed by author name).
  var AUTHOR_BOOKMARK_KEY = 'storyArchive.authorBookmarks.v1';

  function loadBookmarks(key){
    try {
      var raw = localStorage.getItem(key);
      return new Set(raw ? JSON.parse(raw) : []);
    } catch(e){ return new Set(); }
  }
  var BASE_URL = 'https://mcstories.com/';
  function storyUrl(href){ return BASE_URL + href; }
  var bookmarks = loadBookmarks(BOOKMARK_KEY);
  var authorBookmarks = loadBookmarks(AUTHOR_BOOKMARK_KEY);
  function saveBookmarks(){
    try { localStorage.setItem(BOOKMARK_KEY, JSON.stringify(Array.from(bookmarks))); } catch(e){}
  }
  function saveAuthorBookmarks(){
    try { localStorage.setItem(AUTHOR_BOOKMARK_KEY, JSON.stringify(Array.from(authorBookmarks))); } catch(e){}
  }
  function toggleAuthorBookmark(name){
    if (!name) return;
    if (authorBookmarks.has(name)) authorBookmarks.delete(name);
    else authorBookmarks.add(name);
    saveAuthorBookmarks();
    updateSavedToggleLabel();
    updateAuthorPanelBookmark();
  }
  function toggleBookmark(href){
    if (!href) return;
    if (bookmarks.has(href)) bookmarks.delete(href);
    else bookmarks.add(href);
    saveBookmarks();
    updateSavedToggleLabel();
  }
  function bookmarkBtnHtml(href, extraClass){
    var on = bookmarks.has(href);
    var icon = on
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3a2 2 0 0 0-2 2v16l8-5 8 5V5a2 2 0 0 0-2-2z"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3a2 2 0 0 0-2 2v16l8-5 8 5V5a2 2 0 0 0-2-2z"/></svg>';
    return '<button type="button" class="bookmark-btn' + (on ? ' active' : '') + (extraClass ? ' ' + extraClass : '') +
      '" data-href="' + escapeHtml(href) + '" aria-pressed="' + on + '" aria-label="' +
      (on ? 'Remove bookmark' : 'Bookmark this story') + '" title="' +
      (on ? 'Remove bookmark' : 'Bookmark this story') + '">' + icon + '</button>';
  }

  // Bookmark tab for an author row (same look as a story's tab).
  function authorBookmarkBtnHtml(name){
    var on = authorBookmarks.has(name);
    var icon = on
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3a2 2 0 0 0-2 2v16l8-5 8 5V5a2 2 0 0 0-2-2z"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3a2 2 0 0 0-2 2v16l8-5 8 5V5a2 2 0 0 0-2-2z"/></svg>';
    var label = on ? 'Remove author bookmark' : 'Bookmark this author';
    return '<button type="button" class="bookmark-btn author-bookmark-btn' + (on ? ' active' : '') +
      '" data-author="' + escapeHtml(name) + '" aria-pressed="' + on + '" aria-label="' + label + '" title="' + label + '">' + icon + '</button>';
  }

  var tagLabels = {};
  var tagCounts = {};
  Object.keys(tagDefs).forEach(function(code){
    tagLabels[code] = tagDefs[code].label;
    tagCounts[code] = tagDefs[code].count;
  });

  var TAG_GROUPS = [
    { name: 'Relationships', tags: ['mf','ff','mm'] },
    { name: 'Power Dynamics', tags: ['fd','md','ds','hm','nc'] },
    { name: 'Kink & Fetish', tags: ['bd','ft','ex','la','ws','sc'] },
    { name: 'Taboo', tags: ['in','be','ca'] },
    { name: 'Genre & Setting', tags: ['sf','rb','ts','cb','fu'] },
    { name: 'Other', tags: ['hu','ma','gr'] }
  ];

  var chips = {};
  var taggroups = document.getElementById('taggroups');
  var groupBadges = {};

  function cycleTagState(code){
    var chip = chips[code];
    if (!chip) return;
    var next = chip.dataset.state === 'none' ? 'include'
              : chip.dataset.state === 'include' ? 'exclude'
              : 'none';
    chip.dataset.state = next;
    chip.classList.toggle('active', next === 'include');
    chip.classList.toggle('excluded', next === 'exclude');
  }

  function buildChip(code){
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'tag-chip';
    chip.dataset.code = code;
    chip.dataset.state = 'none';
    chip.innerHTML = '<span class="label">' + tagLabels[code] + '</span><span class="count">' + (tagCounts[code] || 0) + '</span>';
    chip.addEventListener('click', function(){
      cycleTagState(code);
      updateGroupBadges();
      render();
    });
    chips[code] = chip;
    return chip;
  }

  TAG_GROUPS.forEach(function(group, gi){
    var details = document.createElement('details');
    details.className = 'tag-group';

    var summary = document.createElement('summary');
    var badge = document.createElement('span');
    badge.className = 'group-badge';
    var right = document.createElement('span');
    right.className = 'summary-right';
    right.appendChild(badge);
    var chevron = document.createElement('span');
    chevron.className = 'chevron';
    chevron.textContent = '\u25b8';
    right.appendChild(chevron);

    summary.textContent = group.name;
    summary.appendChild(right);
    details.appendChild(summary);

    var row = document.createElement('div');
    row.className = 'tag-row';
    group.tags.forEach(function(code){
      if (!(code in tagLabels)) return;
      row.appendChild(buildChip(code));
    });
    details.appendChild(row);

    taggroups.appendChild(details);
    groupBadges[group.name] = { badge: badge, tags: group.tags };
  });

  var tagCodes = Object.keys(chips);

  function updateGroupBadges(){
    Object.keys(groupBadges).forEach(function(name){
      var info = groupBadges[name];
      var n = info.tags.filter(function(t){ return chips[t] && chips[t].dataset.state !== 'none'; }).length;
      if (n > 0){
        info.badge.textContent = n;
        info.badge.classList.add('show');
      } else {
        info.badge.classList.remove('show');
      }
    });
  }

  var searchInput = document.getElementById('search');
  var modeAnd = document.getElementById('mode-and');
  var modeOr = document.getElementById('mode-or');
  var viewStoriesBtn = document.getElementById('view-stories');
  var viewAuthorsBtn = document.getElementById('view-authors');
  var clearBtn = document.getElementById('clearall');
  var resultsEl = document.getElementById('results');
  var emptyEl = document.getElementById('emptystate');
  var countEl = document.getElementById('resultcount');
  var totalEl = document.getElementById('totalcount');
  var pageTitleEl = document.getElementById('pagetitle');
  var sentinel = document.getElementById('sentinel');
  var savedToggle = document.getElementById('saved-toggle');
  var savedToggleIcon = savedToggle.querySelector('.saved-toggle-icon');
  var savedToggleLabel = savedToggle.querySelector('.saved-toggle-label');

  var scopeToggle = document.getElementById('scope-toggle');
  var scopeTitleBtn = document.getElementById('scope-title');
  var scopeSynopsisBtn = document.getElementById('scope-synopsis');
  // 'title' = search story titles only (default), 'synopsis' = search synopses only
  var searchScope = 'title';
  function updateScopeToggle(){
    var isSyn = searchScope === 'synopsis';
    scopeTitleBtn.classList.toggle('active', !isSyn);
    scopeSynopsisBtn.classList.toggle('active', isSyn);
    if (viewMode !== 'authors') searchInput.placeholder = isSyn ? 'Search synopses…' : 'Search titles…';
    updateScopeCollapse();
  }

  // Author view always searches author names, so the toggle doesn't apply
  // there and slides closed (the CSS transition on .scope-toggle does the
  // sliding). Author rows no longer expand in place, so rebuilding the list
  // is cheap and the slide can simply run as soon as the view changes.
  function updateScopeCollapse(){
    var collapse = viewMode === 'authors';
    scopeToggle.classList.toggle('collapsed', collapse);
    // Keep the collapsed buttons out of tab order / screen readers.
    if (collapse) scopeToggle.setAttribute('inert', ''); else scopeToggle.removeAttribute('inert');
    scopeToggle.setAttribute('aria-hidden', collapse);
  }
  function setScope(scope){
    if (searchScope === scope) return;
    searchScope = scope;
    clearTimeout(debounceTimer);
    render();
  }
  scopeTitleBtn.addEventListener('click', function(){ setScope('title'); });
  scopeSynopsisBtn.addEventListener('click', function(){ setScope('synopsis'); });

  var BOOKMARK_ICON_OUTLINE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3a2 2 0 0 0-2 2v16l8-5 8 5V5a2 2 0 0 0-2-2z"/></svg>';
  var BOOKMARK_ICON_FILLED = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3a2 2 0 0 0-2 2v16l8-5 8 5V5a2 2 0 0 0-2-2z"/></svg>';

  // 'none' = no filter, 'include' = saved only, 'exclude' = hide saved.
  // The Saved button follows the current view: in Stories it filters/counts
  // saved stories, in Authors it filters/counts saved authors. Each view
  // remembers its own filter state when you switch back and forth.
  var savedStateByMode = {stories: 'none', authors: 'none'};
  function currentSavedKey(){ return viewMode === 'authors' ? 'authors' : 'stories'; }
  function updateSavedToggleLabel(){
    var key = currentSavedKey();
    var state = savedStateByMode[key];
    var n = (key === 'authors' ? authorBookmarks : bookmarks).size;
    savedToggle.classList.toggle('active', state === 'include');
    savedToggle.classList.toggle('excluded', state === 'exclude');
    savedToggle.setAttribute('aria-pressed', state === 'include');
    savedToggle.title = key === 'authors' ? 'Saved authors' : 'Saved stories';
    savedToggleIcon.innerHTML = state === 'include' ? BOOKMARK_ICON_FILLED : BOOKMARK_ICON_OUTLINE;
    var label = state === 'include' ? 'Saved only' : state === 'exclude' ? 'Hide saved' : 'Saved';
    savedToggleLabel.textContent = label + (n ? ' (' + n + ')' : '');
  }
  updateSavedToggleLabel();
  savedToggle.addEventListener('click', function(){
    var key = currentSavedKey();
    var st = savedStateByMode[key];
    savedStateByMode[key] = st === 'none' ? 'include' : st === 'include' ? 'exclude' : 'none';
    updateSavedToggleLabel();
    render();
  });

  var totalAuthorCount = Object.keys(stories.reduce(function(acc, s){ if (s.author) acc[s.author] = 1; return acc; }, {})).length;

  var viewMode = 'stories';

  function updateTotalText(){
    if (viewMode === 'authors'){
      pageTitleEl.textContent = 'Browse every author';
      totalEl.textContent = totalAuthorCount.toLocaleString() + ' authors. Click one to see everything they\u2019ve written.';
    } else {
      pageTitleEl.textContent = 'Browse every story';
      totalEl.textContent = stories.length.toLocaleString() + ' stories. Last Updated Aug 22, 2026';
    }
  }
  updateTotalText();

  function updateSortLabels(){
    document.querySelectorAll('.summary-label').forEach(function(el){
      el.textContent = viewMode === 'authors' ? el.dataset.authorsLabel : el.dataset.storiesLabel;
    });
  }

  viewStoriesBtn.addEventListener('click', function(){
    if (viewMode === 'stories') return;
    closeAuthorPanel();
    viewMode = 'stories';
    viewStoriesBtn.classList.add('active');
    viewAuthorsBtn.classList.remove('active');
    searchInput.placeholder = 'Search stories…';
    clearTimeout(debounceTimer);
    updateTotalText();
    updateSortLabels();
    render();
  });

  viewAuthorsBtn.addEventListener('click', function(){
    if (viewMode === 'authors') return;
    closeAuthorPanel();
    viewMode = 'authors';
    viewAuthorsBtn.classList.add('active');
    viewStoriesBtn.classList.remove('active');
    searchInput.placeholder = 'Search authors…';
    clearTimeout(debounceTimer);
    updateTotalText();
    updateSortLabels();
    render();
  });

  // Jump from a story's "by AuthorName" link straight to that author's
  // full portfolio in the Authors view, pre-expanded and scrolled into
  // view. Used by the mini-panel's "View all works" button.
  function goToAuthor(name){
    authorPanelExpandedSet.forEach(function(href){ authorStoryExpandedSet.add(href); });
    closeAuthorPanel();
    viewMode = 'authors';
    viewAuthorsBtn.classList.add('active');
    viewStoriesBtn.classList.remove('active');
    searchInput.placeholder = 'Search authors…';
    clearTimeout(debounceTimer);
    searchInput.value = name;
    authorExpandedSet.add(name);
    updateTotalText();
    updateSortLabels();
